# Union Diplomacy
 UNION_HOSTILE_GREETING_03:0 "It is the right of working xenos to organize to get their fair share. Until you see it our way, we have nothing to discuss."
 UNION_HOSTILE_GREETING_04:0 "The [From.GetName] has no business with the [Root.GetName]. Not while you continue to stonewall contract negotiations."
 UNION_HOSTILE_GREETING_05:0 "The [Root.GetAdj] don't cross picket lines, [From.GetSpeciesNamePlural]. We're not scabs."
 UNION_CORP_HOSTILE_GREETING_01:0 "The meetings will continue until morale improves."
 UNION_CORP_HOSTILE_GREETING_02:1 "The reason your reports this quarter haven't met projections is because your employees are dissatisfied. Do you really think abusing them will make you richer?"
 UNION_CORP_HOSTILE_GREETING_03:0 "Collective bargaining rights will come to the [From.GetAdj] workers. That's not a promise. That is a threat."
 CORP_UNION_HOSTILE_GREETING_01:0 ""
 CORP_UNION_HOSTILE_GREETING_02:0 ""
 CORP_UNION_HOSTILE_GREETING_03:0 ""
 UNION_UNION_HOSTILE_GREETING:0 "As you're well aware, we don't negotiate with scabs and strike-breakers, [From.GetSpeciesNamePlural]."
 UNION_NEUTRAL_GREETING_01:1 "Welcome to the [Root.GetName]. Are you here to fill out a strike card, or discuss a union contract?"
 UNION_NEUTRAL_GREETING_02:0 "The [Root.GetName] employs the best legal representatives in the galaxy to protect your labor rights. Are your wages equal to your value? Let us help!"
 UNION_NEUTRAL_GREETING_03:0 "Welcome, [From.GetSpeciesNamePlural]! Would you like a sample of our complementary educational literature? Or are you here to discuss collaboration opportunities?"
 UNION_NEUTRAL_GREETING_04:0 "We're proud to represent the interests of working-class xenos throughout the galaxy. Remember, we're here to fight for YOU!"
 UNION_CORP_NEUTRAL_GREETING_01:0 "Competitive economic models are an outmoded and counterproductive means of allocating labor, [From.GetSpeciesNamePlural]."
 CORP_UNION_NEUTRAL_GREETING_01:0 ""
 UNION_UNION_NEUTRAL_GREETING_01:0 "Your last holo-leaflet campaign was inspiring, [From.GetSpeciesNamePlural]. It really feels like you connect with the needs of workers."
 UNION_THREATENED_GREETING_01:1 "Nobody wants a general strike, [From.GetSpeciesNamePlural]. Let's negotiate before we're forced to resort to the nuclear option."
 UNION_FRIENDLY_GREETING_02:0 "Ah, [From.GetSpeciesNamePlural]! How wonderful it is to see you. [Root.GetAdj] union membership is up 5% this quarter, and climbing! How are you doing?"
 UNION_CORP_FRIENDLY_GREETING_01:1 "I don't see anything wrong with a little philosophical rivalry. It keeps the [Root.GetSpeciesBrain] flexible. You'll see things our way eventually."
 CORP_UNION_FRIENDLY_GREETING_01:0 "Well, I still don't think that socialism is the way to make a profit. Why would I let go of money that I don't have to? But you [From.GetSpeciesNamePlural] seem alright. Mostly."
 UNION_UNION_FRIENDLY_GREETING_01:1 "It's good to have an ally in the great class struggle like the [From.GetName]. How can we help you today?"
 UNION_WAR_GREETING_02:0 "You should have negotiated fairly when you had the chance, [From.GetSpeciesNamePlural]."
 UNION_WAR_GREETING_03:1 "Don't underestimate the resolve of a united coalition of workers, [From.GetSpeciesNamePlural]. This general strike will continue until one of us caves."
 UNION_WAR_GREETING_04:1 "Witness the superior engineering and armaments of the [Root.GetAdj] Dockworkers' Union! Quality unmatched by uncompensated labor!"
 UNION_CORP_WAR_GREETING_01:1 "How do you like our ships? Examine the handiwork closely, and you'll find that the [Root.GetAdj] Metalworkers' Union produces results far superior to capitalist wage-slaves."
 UNION_CORP_WAR_GREETING_02:0 "See the difference in vigor and effort from workers who truly believe in themselves and their labor! [From.GetAdj] interns wouldn't lift a finger to defend such unfit management!"
 CORP_UNION_WAR_GREETING_01:0 ""
 CORP_UNION_WAR_GREETING_02:0 ""
 UNION_UNION_WAR_GREETING_01:0 ""
 UNION_UNION_WAR_GREETING_02:0 ""
 UNION_UNION_WAR_GREETING_03:0 ""
 UNION_OVERLORD_GREETING_01:2 "As your union representative, it is our privilege to protect your labor rights in the galaxy. We lead together, [From.GetSpeciesNamePlural]!"
 UNION_OVERLORD_GREETING_02:1 "[From.GetSpeciesNamePlural], please come in. Are you here to discuss your collective bargaining agreement? Or are you here to talk about something else?"
 UNION_VASSAL_GREETING_01:1 "We trust that our pension and healthcare benefits are in good hands, [From.GetSpeciesNamePlural]. We do intend to retire at some point, you know."
 UNION_VASSAL_GREETING_02:1 "The [Root.GetName] is glad to provide its labor for just compensation, so long as our work-life balance and our military defense agreements remain favorable."
 UNION_VASSAL_GREETING_DISLOYAL_01:1 "We're not pleased with our agreement, [From.GetSpeciesNamePlural]. Not pleased at all. You know what happens when unionized workers aren't pleased, yes?"
 UNION_VASSAL_DOMINEERING_01:3 "Remember what happens to scabs, [From.GetSpeciesNamePlural]. If you decide to cross the picket line, we're not responsible for what happens."
 UNION_DOW_PROPOSE_01:1 "Attention [Root.GetName]: Due to protracted fair trade negotiations and numerous complaints of unfair treatment, the [From.GetName] hereby declares a general strike. Expect our warships on Monday."
 UNION_DOW_PROPOSE_02:0 "Attention [Root.GetName]: Due to demands for intercession from [Root.GetAdj] employees seeking collective bargaining rights, the [From.GetName] hereby declares a general strike. Expect our warships on Monday."
 UNION_DOW_PROPOSE_03:0 "Attention [Root.GetName]: Due to irreconciliable differences of economic equality and an unproductive diplomatic relationship, the [From.GetName] hereby declares a general strike. Our collective list of demands is attached to this message."
 UNION_DOW_PROPOSE_04:0 "Attention [Root.GetName]: Due to breached contract agreements and a lapsed window to cure, by the authority of the [From.GetAdj] Labor Protection Bureau, the [From.GetName] hereby declares a general strike. Our list of grievances is attached to this message."
 UNION_VASSAL_DOW_PROPOSE_01:0 "Attention [From.GetName]: This is a general strike. You already know our demands. Surrender, or die."
 UNION_DOW_ACCEPT_01:1 "There is no war but class war, [From.GetAdj] scum! But the [Root.GetName] will gladly oblige!"
 UNION_DOW_ACCEPT_02:0 "It seems that you don't know what a united worker's collective is capable of. Allow us to educate you on the failings of capitalism."
 UNION_DOW_ACCEPT_03:0 "How regrettable it is that you've chosen such an unproductive relationship. But very well. Alert the stewards; this is a general strike!"
 UNION_CONSIDER_01:1 "Thank you for submitting your request. A union representative will be with you shortly."
 UNION_CONSIDER_02:0 "Thank you for submitting your request. While you wait, would you consider donating §Y£trade£ 10 Credits§! to the All-[From.GetAdj] Young Leaders' Scholarship Fund?"
 UNION_PEACE_PROPOSE_01:1 "We're ready to return to the bargaining table whenever you are, [Root.GetSpeciesNamePlural]. We have a panel of legal representatives from the [From.GetAdj] Military Workers' Union on standby."
 UNION_PEACE_PROPOSE_02:0 "This conflict is unproductive for us and unprofitable for your shareholders. On behalf of the [From.GetAdj] Diplomats' Guild, I am authorized to negotiate an end to the strike."
 UNION_PEACE_PROPOSE_03:1 "Comrades, please, the shedding of the [From.GetBloodType] of workers must end. Are we to repeat the mistakes of the bourgeoisie of the past? Let us discuss an end to these hostilities."
 UNION_PEACE_PROPOSE_04:0 "Know that it is in our very [From.GetBloodType], in our very souls to oppose you. But a ceasefire is imminent... if you fascist [Root.GetSpeciesNamePluralInsult] can even restrain yourselves."
 UNION_PEACE_ACCEPT_01:2 "Excellent. This will conclude our business for the foreseeable future. We'll see you at work on Monday."
 UNION_PEACE_ACCEPT_02:2 "As long as fascism and its precursors exist in the galaxy, we shall have work to do, [From.GetSpeciesNamePlural]. Count on it."
 UNION_PEACE_REFUSE_01:1 "On reviewing the fine print of this diplomatic agreement, the Interstellar [Root.GetAdj] Lawyers' Guild detected several discrepancies. These terms are not acceptable."
 UNION_PEACE_REFUSE_02:0 "We're not signing anything until you have agreed to reparations to members of the [Root.GetAdj] Starship Pilots' Association for loss of life and limb."
 UNION_PEACE_REFUSE_03:0 "And what about the gratuity fees to the [From.GetAdj] Military Workers' Union? Their pensions and hazard pay aren't covered in this agreement. We can't sign."
 UNION_PEACE_REFUSE_04:0 "Ha! You're kidding. I can't take this back to the picket line, I'd have my hat and badge yanked for sure. I'm not losing my pension over this."
 UNION_VASSAL_PEACE_REFUSE_01:1 "You filthy commies aren't getting away that easily! We're fighting for truth, justice, and the [From.GetAdj] way!"
 UNION_OVERLORD_PEACE_REFUSE_01:1 "You two-faced backstabbing scabs are going to regret turning on your own comrades. If you like your ambulatory appendages where they are, you'll think twice about pulling one over on us!"
 UNION_PEACE_CONSIDER_01:1 "The [Root.GetName] will discuss ending the strike. But only if we like this offer."
 UNION_ITOA_SELECT_01:1 "Understand that an agreement with the [Root.GetName] entails a non-negotiable pre-federation contract to protect [Root.GetAdj] rights. Just in case."
 UNION_ITOA_SELECT_02:1 "Well, we do like solidarity. We like it very much indeed."
 UNION_ITOA_PROPOSE_01:2 "The [Root.GetName] has a sterling record of advocacy, legal insight, and public outreach. In the courtroom, the workplace, or the battlefield, we would be prepared to offer you the [From.GetAllianceName]'s peerless union-certified assistance (barring contractual caveats)."
 UNION_ITOA_PROPOSE_02:2 "The [From.GetName] would like to propose an alliance with the [Root.GetName]. After reviewing canvas data from [Root.GetAdj] citizens, we've determined that your record merits a formal partnership of solidarity."
 UNION_CORP_ITOA_PROPOSE_01:0 "The [From.GetName] and the [Root.GetName] might not always see [From.GetEyeName]-to-[Root.GetEyeName] on matter of economic equality. But, you can't deny that [From.GetAllianceName] membership would be a lucrative opportunity."
 UNION_CORP_ITOA_PROPOSE_02:0 "We are firm believers in the ideals of cooperation, and sharing the fruit of our labor. While we may have our differences, we believe that our partnership could be even more beneficial. Contractual obligations notwithstanding, obviously."
