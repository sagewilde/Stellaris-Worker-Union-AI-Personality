# To Union Diplomacy
 DEMAND_SUBS_SELECT_01:0 "Are you proposing that the [Root.GetName] becomes your subsidiary?"
 DEMAND_SUBS_ACCEPT_01:1 "As your subsidiary, the [Root.GetName] will share some of its trade with you. In exchange we expect you to defend the defend the life, liberty and independence of the [Root.GetSpeciesNamePlural]."
 DEMAND_SUBS_REFUSE_01:0 "The [Root.GetName] will under no circumstances be a willing subject to [From.GetSpeciesAdj] exploitation."
 ASK_FOR_SUBS_PROPOSE_01:0 "The [Root.GetName] is in need of military protection. Make us a subsidiary under [From.GetAdj] rule and we, as your loyal subject, will offer you a substantial portion of our trade."
 TO_UNION_HOSTILE_GREETING_01:0 "Ah, [From.GetName]. Let me guess, you have a special offer just for us?"
 TO_UNION_HOSTILE_GREETING_02:0 "Ah, if it isn't [From.GetName]. What have you come to offer us today? What lies, what scams, what empty promises?"
 TO_UNION_HOSTILE_GREETING_03:0 "Oh, it's you... Would you mind "self-actualizing" somewhere else?"
 TO_UNION_HOSTILE_GREETING_04:0 "The [Root.GetName] is not for sale, [From.GetName]."
 TO_UNION_HOSTILE_GREETING_05:0 "$UNION_HOSTILE_GREETING_01$"
 TO_UNION_HOSTILE_GREETING_06:0 "$UNION_HOSTILE_GREETING_02$"
 TO_UNION_GREETING_HOSTILE_EG_01:0 "Capitalism is but a stepping stone on the path to a classless society, [From.GetName]."
 TO_UNION_NEUTRAL_GREETING_01:0 "Greetings, [From.GetName]. How fares business?"
 TO_UNION_NEUTRAL_GREETING_02:0 "Well met, [From.GetName]! It seems our translation modules are having a slight hiccup. Are you saying you would like to touch our base?"
 TO_UNION_THREATENED_GREETING_01:0 "Greetings, [From.GetName]. We hope you recognize the potential in the [Root.GetAdj] market."
 TO_UNION_FRIENDLY_GREETING_01:0 "We saw your latest advertisement campaign and what can we say, just take our money, [From.GetName]!"
 TO_UNION_FRIENDLY_GREETING_02:0 "A good day for business, is it not, [From.GetName]? Credits, credits, credits... Like music to our ears."
 TO_UNION_FRIENDLY_GREETING_03:0 "Hello there, [From.GetName]! How goes the bar raising, the envelope pushing, the number crunching?"
 TO_UNION_WAR_GREETING_01:0 "Prepare for budget cuts, [From.GetName]..."
 TO_UNION_WAR_GREETING_02:0 "We are very excited for your clearance sale, [From.GetName]. Some of your planetary bodies have garnered our interest..."
 TO_UNION_WAR_GREETING_03:0 "Cutting your future short is our present, [From.GetName]..."
 TO_UNION_VASSAL_GREETING_01:0 "Anchors aweigh, [From.GetName], because the [Root.GetName] is 100% on board with you!"
 TO_UNION_VASSAL_GREETING_DISLOYAL_01:0 "Lately we've had a sneaking suspicion that you are using us for credits, [From.GetName]..."
 TO_UNION_VASSAL_DOMINEERING_01:0 "There are some things credits cannot buy, [From.GetName]. Watch and learn."
 TO_UNION_DOW_PROPOSE_01:0 "[Root.GetName] is a threat to all sapient life. The galaxy must be purged of your tawdry wares before it succumbs to complete moral decline."
 TO_UNION_DOW_PROPOSE_02:0 "The [From.GetName] will no longer stand for your underhanded practices and unconscionable exploitation of common galactic assets."
 TO_UNION_DOW_PROPOSE_03:0 "The [Root.GetName] brand is an affront to good taste. We can no longer tolerate your presence in the galaxy."
 TO_UNION_DOW_PROPOSE_04:0 "Let it be known that the galaxy has no further need for your "services", [Root.GetName]..."
 TO_UNION_INSULT_FRIENDLY_01:0 "What was that, [From.GetName]? We were just poring over your latest marketing campaign! It's gone viral!"
 TO_UNION_INSULT_NEUTRAL_01:0 "Explain yourselves, [From.GetSpeciesNamePlural]. If this is how you do business at [From.GetName] we're not interested."
 TO_UNION_INSULT_HOSTILE_01:0 "Speak plainly, [From.GetName]. We've had enough of your corporate obscurities."
 TO_UNION_INSULT_PROPOSE_01:0 "The galaxy is not your personal garbage disposal unit, [Root.GetName]. Keep your so-called products to yourselves."
 TO_UNION_INSULT_PROPOSE_02:0 "[Root.GetName] products... Straight from the bargain bin to the garbage bin..."
 TO_UNION_INSULT_PROPOSE_EG_01:0 "You are an embodiment of the capitalist system's most fundamental shortcoming. Credits cannot buy you class, [Root.GetName]."
 TO_UNION_INSULT_ACCEPT_FRIENDLY_01:0 "Ha! That's a good one. What's a little light-hearted banter between friends, eh?"
 TO_UNION_INSULT_ACCEPT_FRIENDLY_02:0 "Ah, you pen-pushers are a real hoot! You really know how to tickle our giggly bone. Now, if we could return to business..."
 TO_UNION_INSULT_ACCEPT_01:0 "[From.GetName] is run by swindlers and corporate hacks! Soon the [Root.GetName] will expose your true face to the world."
 TO_UNION_INSULT_ACCEPT_02:0 "That's an interesting business strategy you've got, [From.GetName]... Antagonizing your future clients..."
 TO_UNION_INSULT_ACCEPT_03:0 "Your cheek will cost you, [From.GetName]. We hope it was worth it."
 TO_UNION_INSULT_ACCEPT_04:0 "You will soon learn that there is, in fact, such a thing as bad PR."
 TO_UNION_MAKE_RIVAL_01:0 "Can you really afford to lose our business, [From.GetSpeciesNamePlural]?"

# Union Diplomacy
 UNION_HOSTILE_GREETING_01:1 "Take your business elsewhere, [From.GetName]. The [Root.GetSpeciesNamePlural] have no need for your off-brand refuse."
 UNION_HOSTILE_GREETING_02:0 "There is no marketplace need for the likes of you, [From.GetName]."
 UNION_HOSTILE_GREETING_03:0 "You cannot afford our services [From.GetSpeciesNamePlural]..."
 UNION_HOSTILE_GREETING_04:0 "The [Root.GetName] is not open for business, [From.GetSpeciesNamePlural]."
 UNION_HOSTILE_GREETING_05:0 "The [Root.GetName] has nothing to offer you, [From.GetSpeciesNamePlural]."
 UNION_CORP_HOSTILE_GREETING_01:0 "Some friendly advice from one business to another... You would do well to start future-proofing. Or you will soon be obsolete, [From.GetSpeciesNamePlural]."
 UNION_CORP_HOSTILE_GREETING_02:1 "You give honest corporations a bad name, [From.GetName]."
 UNION_CORP_HOSTILE_GREETING_03:0 "The [Root.GetAdj] secret sauce brings all the aliens to the yard. We could teach you, but we'd have to charge..."
 CORP_UNION_HOSTILE_GREETING_01:0 ""
 CORP_UNION_HOSTILE_GREETING_02:0 ""
 CORP_UNION_HOSTILE_GREETING_03:0 ""
 UNION_NEUTRAL_GREETING_01:1 "Welcome to [Root.GetName], your number one, on-demand actualizer of intellectual capital. How can we help you?"
 UNION_NEUTRAL_GREETING_02:0 "Let us talk business, [From.GetSpeciesNamePlural]."
 UNION_NEUTRAL_GREETING_03:0 "[From.GetSpeciesNamePlural]! Would you like a virtual tour of the office ball pit?"
 UNION_NEUTRAL_GREETING_04:0 "None of the best things in life are free, [From.GetSpeciesNamePlural]. But here at [Root.GetName], they're cheap."
 UNION_CORP_NEUTRAL_GREETING_01:0 "Good going on your latest marketing campaign, [From.GetName]! It really resonated with us."
 CORP_UNION_NEUTRAL_GREETING_01:0 ""
 UNION_THREATENED_GREETING_01:1 "The world is vast and full of exploitable riches. Surely there is enough for both of us?"
 UNION_FRIENDLY_GREETING_02:0 "Ah, the [From.GetSpeciesNamePlural]. Prospects are looking good for a future joint venture."
 UNION_CORP_FRIENDLY_GREETING_01:1 "How's it hanging, [From.GetName]? Business as usual?"
 CORP_UNION_FRIENDLY_GREETING_01:0 ""
 UNION_WAR_GREETING_02:0 "On behalf of our quality assurance department we thank you, [From.GetSpeciesNamePlural], for this long awaited opportunity to test our latest line of weaponry."
 UNION_WAR_GREETING_03:1 "How do you like our new ship designs, [From.GetSpeciesNamePlural]? Megatons of chrome perfection, delivered straight to your door. At [Root.GetName] we always go the extra mile!"
 UNION_WAR_GREETING_04:1 "The [Root.GetName] is the galaxy's leading constructor and developer of revolutionary defense hardware. As you will soon find, our commitment to quality is absolute."
 UNION_CORP_WAR_GREETING_01:1 "We're coming for your market shares, [From.GetName]. And when we're through, your name will be forgotten. The galaxy will be screaming only for [Root.GetAdj] product!."
 UNION_CORP_WAR_GREETING_02:0 "We will put you out of business, [From.GetName]."
 CORP_UNION_WAR_GREETING_01:0 ""
 CORP_UNION_WAR_GREETING_02:0 ""
 UNION_OVERLORD_GREETING_01:2 "[From.GetSpeciesNamePlural]! We were just now evaluating your performance based on the D.O.R.P scale, and are pleased to announce that you §Gmeet expectations§!!! Keep up the good work!"
 UNION_OVERLORD_GREETING_02:1 "Ask not what you can do for your holding company, but what your holding company can do for you, [From.GetSpeciesNamePlural]. We are here to empower YOU."
 UNION_VASSAL_GREETING_01:1 "We, the eager student, the hope of the future, full of untapped potential! You, the revered mentor - the guru, the voice of generations past..."
 UNION_VASSAL_GREETING_02:1 "Did you see our quarterly earnings report, [From.GetSpeciesNamePlural]? Projections for the next quarter are skyrocketing. Up and to the right!"
 UNION_VASSAL_GREETING_DISLOYAL_01:1 "What's your game plan, [From.GetSpeciesNamePlural]? The [From.GetName] is a top of the line, resource-maximizing machine. What exactly are you bringing to the table?"
 UNION_VASSAL_DOMINEERING_01:3 "We dominate the market, [From.GetSpeciesNamePlural]. You would do well to take a page out of our book."
 UNION_DOW_PROPOSE_01:1 "Ah, [Root.GetSpeciesNamePlural]... You're still here! Maybe our fleet can incentivize you to...die?"
 UNION_DOW_PROPOSE_02:0 "Nothing drives development forward like a little friendly competition."
 UNION_DOW_PROPOSE_03:0 "Don't take it personally, [Root.GetSpeciesNamePlural]. It's just business."
 UNION_VASSAL_DOW_PROPOSE_01:1 "[Root.GetSpeciesNamePlural]! As we once again evaluated your inadequacy as our holding company we discovered a hole in your defenses..."
 UNION_DOW_ACCEPT_01:1 "If it is war you want the [From.GetName] will give you plenty of bang for your buck. We go big or go home!"
 UNION_DOW_ACCEPT_02:0 "Prepare to have your assets liquidated, [Root.GetSpeciesNamePlural]."
 UNION_DOW_ACCEPT_03:0 "Valued clients! Here at [From.GetName] no request is too big. We bring custom-made, user friendly solutions to all our clients. Ready the fleet!"
 UNION_CONSIDER_01:1 "Valued client! We are doing our utmost to evaluate your request."
 UNION_CONSIDER_02:0 "Valued client! As we evaluate your proposition, would you care to fill out our trust survey? It will only take a minute of your time! Your opinion matters!"
 UNION_PEACE_PROPOSE_01:1 "Shall we replace this costly exchange of lost hardware and lives for one of goods and services?"
 UNION_PEACE_PROPOSE_02:0 "As it turns out, war was not the answer to our budget deficit. We propose an indefinite truce."
 UNION_PEACE_PROPOSE_03:1 "It is clear that none of us stands to gain from a continued conflict. Why throw good money after bad, [Root.GetSpeciesNamePlural]?"
 UNION_PEACE_PROPOSE_04:0 "This conflict has outlived its purpose. We have garnered all the data we need to demonstrate the superiority of our product. We would like to negotiate for peace."
 UNION_PEACE_PROPOSE_05:0 "This war has turned into more of a lose-lose situation than we had bargained for. We propose to table the issue for an indefinite period, subject to quarterly reviews."
 UNION_PEACE_ACCEPT_01:2 "The numbers speak in your favor, [Root.GetSpeciesNamePlural]. In peace there is prosperity."
 UNION_PEACE_REFUSE_01:1 "Peace? Hah! I think not. Gimme' that big old red button!"
 UNION_PEACE_REFUSE_02:0 "Peace schmeaze... Don't be such a stiff. We were just warming up."
 UNION_PEACE_REFUSE_03:0 "Regrettably we cannot agree to your terms, [From.GetSpeciesName]. This war has proven much too lucrative."
 UNION_PEACE_REFUSE_04:0 "Sorry, [From.GetSpeciesNamePlural]. We are not yet done taking advantage of your military inferiority."
 UNION_VASSAL_PEACE_REFUSE_01:1 "The [Root.GetName] will not be held back by a nation of reactionaries."
 UNION_OVERLORD_PEACE_REFUSE_01:1 "We cannot grant you independence in this financial climate. You would crumble under the burden of your own incompetence."
 UNION_PEACE_CONSIDER_01:1 "Peace? We will have to weigh the financial implications closely."
 UNION_ITOA_SELECT_01:1 "Are you ready to bring your A-game [Root.GetSpeciesNamePlural]? The §Y[From.GetName]§! doesn't roll with yesterday's news..."
 UNION_ITOA_PROPOSE_01:2 "The [Root.GetAdj] brand is renowned for its quality! Joining us would allow you to benefit from that credibility."
 UNION_CORP_ITOA_PROPOSE_01:0 "[From.GetName]! Together we could thwart the competition, inflate prices and dominate the market. What say you?"
 UNION_ITOA_ACCEPT_01:1 "Simulated revenue projections from a [From.GetSpeciesAdj]-[Root.GetSpeciesAdj] joint venture are looking good, [From.GetRulerName], or shall I say, partner? We are in!"
 UNION_ITOA_REFUSE_01:1 "The [Root.GetAdj] brand is synonymous with premium quality. We could not risk affiliation with the [From.GetSpeciesNamePlural]."
 UNION_ASK_JOIN_A_SELECT_01:1 "How many balls can you keep in the air, [From.GetSpeciesNamePlural]? Do you have what it takes to join §Y[Root.GetAllianceName]§!?"
 UNION_ASK_JOIN_A_PROPOSE_01:1 "Agile, user-centered solutions and result maximization are just some of the many things the [From.GetName] could bring to the §Y[Root.GetAllianceName]§!. Is that a yes? I definitely heard a yes..."
 UNION_ASK_JOIN_A_ACCEPT_01:1 "Congratulations, [From.GetSpeciesNamePlural]! You're in the big league now. Welcome to the §Y[Root.GetAllianceName]§!."
 UNION_ASK_JOIN_A_REFUSE_01:1 "We have appraised your financials based on the G-WACK pillars and sadly you do not qualify for §Y[Root.GetAllianceName]§! membership. Please do not be afraid to try harder next time."
 UNION_ASK_JOIN_A_REFUSE_02:0 "We have reviewed your application and if we can speak frankly, the [Root.GetSpeciesNamePlural] and the [From.GetSpeciesNamePlural] just aren't singing from the same sheet. If you catch our drift?"
 UNION_LEAVE_A_SELECT_01:1 "If you leave the §Y[From.GetAllianceName]§! we may have to impose sanctions against you."
 UNION_LEAVE_A_PROPOSE_01:1 "As per agreement we wish to terminate the partnership between [From.GetName] and §Y[Root.GetAllianceName]§! on grounds of unfulfilled profit increase. Please refer any complaints to our legal counsel."
 UNION_LEAVE_A_ACCEPT_01:1 "You're jumping a mighty fine ship, [From.GetSpeciesNamePlural], a mighty fine ship!"
 UNION_LEAVE_A_ACCEPT_02:0 "If financial ruin is what you are after the §Y[Root.GetAllianceName]§! won't stand in your way... partner..."
 UNION_DEMAND_VASS_SELECT_01:2 "Please confirm your intention to subjugate the [Root.GetName]."
 UNION_DEMAND_VASS_ACCEPT_01:2 "The [Root.GetAdj] board has voted in favor of the [Root.GetName] becoming a subject state to the [From.GetName]."
 UNION_DEMAND_VASS_REFUSE_01:2 "The [Root.GetName] will not become a subject to an inferior agent."
 UNION_ASK_FOR_VASS_PROPOSE_01:1 "The [From.GetName] is in need of a military sponsor to defend us from hostile competitors. In exchange for your protection the [From.GetName] will become your vassal state."
 UNION_DEMAND_SUBS_SELECT_01:0 "Please confirm your request to subsidiarize the [Root.GetName]."
 UNION_DEMAND_SUBS_PROPOSE_01:0 "Your military insufficiency has put you at risk of hostile takeover. Become a supplement of the [From.GetName] and we, as your holding company, will ensure the liberty of your people."
 UNION_DEMAND_SUBS_PROPOSE_02:0 "We have a special offer for you, [Root.GetSpeciesNamePlural]. Become a subsidiary of the [From.GetName] and partake in our 10 step self-development program, free of charge. Allow OUR fleet to boost YOUR confidence."
 UNION_DEMAND_SUBS_ACCEPT_01:0 "As your subsidiary, the [Root.GetName] and all its associated brands are now legally a part of the [From.GetName] parent company. In return, the [From.GetName] is required to protect the [Root.GetName] from hostile interference."
 UNION_DEMAND_SUBS_REFUSE_01:0 "The [Root.GetName] finds your terms unacceptable and will under no circumstances be subject to [From.GetSpeciesAdj] exploitation."
 UNION_ASK_FOR_SUBS_SELECT_01:1 "Should we proceed, the [Root.GetName] will subsidiarize the [From.GetName]. As your parent company the [Root.GetName] will stand united with the [Root.GetSpeciesNamePlural] against mutual threats."
 UNION_ASK_FOR_SUBS_PROPOSE_01:0 "[Root.GetRulerName] runs a tight ship and we want to learn the [From.GetSpeciesAdj] way. Make the [From.GetName] a subsidiary and we will share some of our trade with you."
 UNION_ASK_FOR_SUBS_ACCEPT_01:0 "Welcome to the [From.GetAdj] corporate family. While the [Root.GetName] still operates as a distinct legal entity, the [From.GetName] now holds a controlling interest in your company and will protect our joint interests from hostile threats."
 UNION_ASK_FOR_SUBS_ACCEPT_02:0 "Good news, [Root.GetSpeciesNamePlural]. You are now our financial slave..."
 UNION_ASK_FOR_SUBS_REFUSE_01:0 "Regretfully we cannot accept your application for subsidiarization at this time. We wish you good luck in your future endeavors, as you will surely need it."
 UNION_RELEASE_SUBJECT_SELECT_01:1 "Do you wish to revoke your status as holding company of the [Root.GetName] and reinstate [Root.GetAdj] autonomy?"
 UNION_RELEASE_SUBJECT_PROPOSE_01:1 "Hereby the [From.GetName] rescinds its ownership of the [Root.GetName] returning it to autonomy, effective immediately."
 UNION_RELEASE_SUBJECT_ACCEPT_01:1 "We will treasure our newly won independence."
 UNION_ASK_TO_BE_RELEASED_SUBJECT_SELECT_01:1 "Be advised, the [Root.GetName] will take legal action to protect its interests."
 UNION_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE_01:1 "Following repeated failure to comply with [From.GetSpeciesAdj] requirements, the [From.GetName] recommends that you revoke our subject status immediately or seek legal counsel."
 UNION_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT_01:1 "The [Root.GetName] hereby grants the [From.GetName] independence, forsaking all legal claims to [From.GetSpeciesAdj] financials."
 UNION_ASK_TO_BE_RELEASED_SUBJECT_REFUSE_01:1 "We regret to inform you that the [Root.GetName] has no intent of reinstating [From.GetSpeciesAdj] autonomy within a foreseeable future. Please refer any complaints to our legal department."
 UNION_ASK_TO_BE_RELEASED_SUBJECT_REFUSE_02:0 "Though we always strive to empower our agents, we advise you to pursue more realistic development goals."
 UNION_DEMAND_PROT_SELECT_01:1 "Please confirm your offer to become a protector of the [Root.GetName]. The agreement, should you sign, is legally binding."
 UNION_DEMAND_PROT_ACCEPT_01:1 "All right nerds, make our enemies go boom and teach us all your science stuff and our marketing department will work its magic. You will have the "it" factor you so badly crave. The galaxy will know your name!"
 UNION_DEMAND_PROT_REFUSE_01:1 "We have a capable fleet of our own, [Root.GetSpeciesNamePlural], and we will not hesitate to use it against those who would impinge upon that which is lawfully ours."
 UNION_ASK_FOR_PROT_PROPOSE_01:1 "The [From.GetName] is a business conglomerate, not a military power. As our competitors take up arms against us, we find ourselves at the mercy of your good will, [Root.GetSpeciesNamePlural]. Will you protect us?"
 UNION_DEMAND_TRIBUTARY_SELECT_01:0 "You want tribute, [Root.GetSpeciesNamePlural]? Give us a number and we'll think about it..."
 UNION_DEMAND_TRIBUTARY_ACCEPT_01:0 "We can ill afford to lose your business, [From.GetSpeciesNamePlural]. In the grand scheme of things, tribute is a small price to pay for peace."
 UNION_DEMAND_TRIBUTARY_ACCEPT_02:0 "Ah, what is a little extortion between friends, [From.GetSpeciesNamePlural]? The [Root.GetName] will gladly pay tribute. You cannot put a price on friendship..."
 UNION_DEMAND_TRIBUTARY_REFUSE_01:0 "The [Root.GetName] will not give in to [From.GetAdj] extortion. We have the law on our side."
 UNION_ASK_BECOME_TRIBUTARY_PROPOSE_01:1 "In the interest of promoting a continued peace between the [From.GetName] and the [Root.GetName], we are willing to pay you monthly tribute."
 UNION_CORP_OFFER_TRADE_DEAL_PROPOSE_01:0 "From one business to another, we have an offer that will make your [Root.GetSpeciesAdj] sensory organs sing."
 UNION_OFFER_TRADE_DEAL_PROPOSE_01:1 "Esteemed [Root.GetSpeciesNamePlural]. We have a business proposal..."
 UNION_OFFER_TRADE_DEAL_ACCEPT_01:1 "Is that your final offer, [From.GetSpeciesNamePlural]? How about some extra minerals to sweeten the deal? No? We'll take it!"
 UNION_OFFER_TRADE_DEAL_ACCEPT_02:0 "Anything for our most valued customers. Never forget who brings you the best deals, [From.GetSpeciesNamePlural]! The [Root.GetName]!"
 UNION_OFFER_TRADE_DEAL_ACCEPT_03:0 "It's a deal! It's always a pleasure doing business with you, [From.GetSpeciesNamePlural]."
 UNION_OFFER_TRADE_DEAL_REFUSE_01:1 "You have some nerve, [From.GetSpeciesNamePlural]. You think the [Root.GetSpeciesNamePlural] were born yesterday?"
 UNION_OFFER_TRADE_DEAL_REFUSE_02:0 "Is that meant to be funny [From.GetSpeciesNamePlural]? The [Root.GetName] is a business, not a charity..."
 UNION_OFFER_TRADE_DEAL_GIFT_ACCEPT_01:0 "Thank you, [From.GetSpeciesNamePlural]. May business on your worlds prosper."
 UNION_OFFER_TRADE_DEAL_GIFT_ACCEPT_02:0 "Are you looking to buy our love, [From.GetSpeciesNamePlural]? Let us bargain."
 UNION_FORM_COMMERCIAL_PACT_SELECT:0 "How intriguing. The [From.GetSpeciesNamePlural] are looking for a business partner? Tell us more..."
 UNION_FORM_COMMERCIAL_PACT_PROPOSE:1 "Ever feel like your life is all about the have-tos and never about the want-tos, [Root.GetSpeciesNamePlural]? Here at [From.GetName] we live for doing the things you don't want to, so you don't have to. Enter a commercial pact with us and maximize the meaningfulness of your existence!"
 UNION_FORM_COMMERCIAL_PACT_PROPOSE:1 "Here at [From.GetName] we consistently deliver more for less, and today we would like to offer you a deal you simply cannot refuse. A commercial pact... with us! Tell us you can't refuse!"
 UNION_FORM_COMMERCIAL_PACT_ACCEPT_01:0 "Free trade between our worlds? Yes... It's quite a vision. We agree to your terms, [From.GetSpeciesNamePlural]."
 UNION_FORM_COMMERCIAL_PACT_ACCEPT_02:0 "A commercial pact? Sounds like a win-win, [From.GetSpeciesNamePlural]. We will draw up the necessary paperwork."
 UNION_FORM_COMMERCIAL_PACT_REFUSE:0 "We have reviewed your offer, [Root.GetSpeciesNamePlural] and sadly the [From.GetName] is not currently looking to expand its business to new worlds."
 UNION_BREAK_COMMERCIAL_PACT_SELECT:0 "But... what of the economy?"
 UNION_BREAK_COMMERCIAL_PACT_PROPOSE:0 "Regrettably the commercial agreement between us has outlived its purpose and we hereby declare it void."
 UNION_BREAK_COMMERCIAL_PACT_ACCEPT:0 "Your isolationist policies have weakened both our economies, [From.GetSpeciesName]."
 UNION_MAKE_RIVAL_02:0 "Put your money where your [From.GetSpeciesMouthName] is, [From.GetSpeciesNameInsult]. Oh wait, that's right, you don't have any money..."
 UNION_MAKE_RIVAL_ACCEPT_FRIENDLY_01:0 "Rejection. It hurts."
 UNION_MAKE_RIVAL_ACCEPT_FRIENDLY_02:0 "It would seem our financial success has come at the price of your friendship..."
 UNION_MAKE_RIVAL_ACCEPT_FRIENDLY_03:0 "Like a blow to the [From.GetSpeciesOrganName]..."
 UNION_MAKE_RIVAL_ACCEPT_NEUTRAL_01:0 "We are sorry to see that our recent success has come between us, [From.GetSpeciesNamePlural]."
 UNION_MAKE_RIVAL_ACCEPT_NEUTRAL_02:0 "Just what you would expect from an inside-the-box thinking nation of backward [From.GetSpeciesNamePluralInsult]."
 UNION_MAKE_RIVAL_ACCEPT_NEUTRAL_03:0 "Your jealousy will cost you, [From.GetSpeciesNamePlural]."
 UNION_MAKE_RIVAL_ACCEPT_NEUTRAL_04:0 "You just lowered your market value, fools."
 UNION_MAKE_RIVAL_ACCEPT_HOSTILE_01:0 "You think you can beat the [Root.GetSpeciesNamePlural] at our own game, [From.GetSpeciesNamePlural]? The [Root.GetName] runs this galaxy."
 UNION_MAKE_RIVAL_PROPOSE_01:1 "If you're not a client you're the competition, [Root.GetSpeciesClassPlural]."
 UNION_MAKE_RIVAL_PROPOSE_02:0 "Cards on the table, [Root.GetSpeciesClassPlural], we never really liked you..."
 UNION_MAKE_RIVAL_PROPOSE_03:0 "The [From.GetName] has issued a trade embargo against the [Root.GetName], restricting all transactions henceforth."
 UNION_MAKE_RIVAL_PROPOSE_04:0 "It's time we did the galaxy a service and rid the market of your cheap, off-brand knockoffs."
 UNION_END_RIVALRY_FRIENDLY_01:0 "There is no reason why trade between the [From.GetSpeciesNamePlural] and the [Root.GetSpeciesClassPlural] should not flourish."
 UNION_END_RIVALRY_NEUTRAL_01:0 "You [From.GetSpeciesClassPlural] are all the same. You all come crawling back for [Root.GetSpeciesAdj] product..."
 UNION_END_RIVALRY_HOSTILE_01:0 "We reserve the right to refuse service to all [From.GetSpeciesNamePlural]."
 UNION_END_RIVALRY_PROPOSE_01:1 "This pointless squabble is bad for business, don't you think, [Root.GetSpeciesNamePlural]?"
 UNION_END_RIVALRY_ACCEPT_01:1 "If you're buying, we're selling...[Root.GetSpeciesNamePlural]."
 UNION_INTEGRATE_01:1 "Hold on! A merger might compromise the integrity of the [Root.GetAdj] brand..."
 UNION_INTEGRATE_ACCEPT_01:1 "The takeover is complete. The [Root.GetName] will now merge with the [From.GetName]."
 UNION_INTEGRATE_ACCEPT_02:0 "[Root.GetSpeciesAdj] resolve and work ethic built the [Root.GetAdj] franchise from the ground up. We will never forget who we are."
 UNION_CANCEL_INTEGRATE_01:1 "Are you having second thoughts regarding the merger, [From.GetSpeciesNamePlural]?"
 UNION_CANCEL_INTEGRATE_ACCEPT_01:1 "So the integrity of the [Root.GetAdj] brand will remain intact..."
 UNION_FORM_DP_SELECT_01:0 "Please confirm your request to enter a defensive pact with the [From.GetName]."
 UNION_FORM_DP_PROPOSE_01:0 "How would you like to enter into a defensive pact with one of the galaxy's number one suppliers of armaments?"
 UNION_FORM_DP_PROPOSE_02:0 "Our calculations show there is great strength in numbers, [From.GetSpeciesNamePlural]. Let us stand united against our enemies."
 UNION_FORM_DP_ACCEPT_01:0 "Your backs are safe, [From.GetSpeciesNamePlural]."
 UNION_FORM_DP_REFUSE_01:0 "Our business is our own, [From.GetSpeciesNamePlural]. It's every [Root.GetSpeciesName] for himself!"
 UNION_FORM_DP_REFUSE_02:0 "The [Root.GetName] is a business, not a charity. You must learn to fend for yourselves, [From.GetSpeciesNamePlural]."
 UNION_BREAK_DP_SELECT_01:0 "Please confirm your request to terminate the [Root.GetAdj]-[From.GetAdj] defensive arrangement."
 UNION_BREAK_DP_PROPOSE_01:0 "Due to persistent failure on your part to meet with defensive pact requirements, we hereby terminate said agreement."
 UNION_BREAK_DP_ACCEPT_01:0 "In accordance with your wish to terminate the [Root.GetAdj]-[From.GetAdj] defensive arrangement, we now withdraw all military support."
 UNION_FORM_NAP_SELECT_01:0 "Please confirm you request to form a non-aggression pact with the [Root.GetSpeciesName]."
 UNION_FORM_NAP_PROPOSE_01:1 "In the interest of securing free trade in our joint sector [From.GetName] would like to propose a non-aggression treaty."
 UNION_FORM_NAP_ACCEPT_01:0 "Our revenue projections do indeed confirm that a mutual peace between the [From.GetName] and the [Root.GetName] is financially beneficial to both parties. Where do we sign?"
 UNION_FORM_NAP_REFUSE_01:0 "We regret to inform you that a [From.GetAdj]-[Root.GetAdj] non-aggression pact does not align with [Root.GetAdj] future expansion goals."
 UNION_BREAK_NAP_SELECT_01:0 "You wish to jeopardize our mutual safety?"
 UNION_BREAK_NAP_PROPOSE_01:0 "Dear, [From.GetName]. We regret to inform you that we are terminating the [Root.GetAdj]-[From.GetAdj] non-aggression pact, effective immediately."
 UNION_BREAK_NAP_ACCEPT_01:0 "Very well, [From.GetSpeciesNamePlural]. We may have to consider a more aggressive expansion plan in the future."
 UNION_GUARANTEE_SELECT_01:0 "Your devotion to the integrity of the [Root.GetAdj] brand makes our cold corporate hearts melt. You truly are our most loyal customers!"
 UNION_GUARANTEE_PROPOSE_01:0 "Valued customers! We care! In fact, we would like to celebrate our mutual friendship by supporting your independence from aggressors! The [From.GetAdj] fleet is now at your disposal!"
 UNION_GUARANTEE_ACCEPT_01:0 "Thank you for helping us ensure that we here at [Root.GetName] can continue to deliver the quality products upon which you have come to rely. Because you're worth it!"
 UNION_REVOKE_GUARANTEE_SELECT_01:0 "Hold on, think about it. Who's going to deliver the quality products upon which you have come to rely if we're no longer around?"
 UNION_REVOKE_GUARANTEE_PROPOSE_01:0 "Regrettably the [From.GetName] can no longer guarantee [Root.GetAdj] independence. We wish you the best of luck in your future endeavors, as you will surely need it."
 UNION_REVOKE_GUARANTEE_ACCEPT_01:0 "Message received, [From.GetSpeciesNamePlural]. Loud and clear."
 UNION_SUPPORT_INDEPENDENCE_SELECT_01:0 "Please confirm your support for [Root.GetAdj] independence by backing our crowdfunding campaign!"
 UNION_SUPPORT_INDEPENDENCE_PROPOSE_01:0 "We here at [From.GetName] have a vested interest in the future of our clients and will back your independence."
 UNION_SUPPORT_INDEPENDENCE_ACCEPT_01:0 "We at [Root.GetName] thank you for interest in [Root.GetAdj] independence."
 UNION_REVOKE_INDEPENDENCE_SELECT_01:0 "Do you wish to retract your support for [Root.GetAdj] independence?"
 UNION_REVOKE_INDEPENDENCE_PROPOSE_01:0 "Regrettably we must retract our support for [Root.GetAdj] independence. We wish you the best of luck in your future endeavors as you will surely need it."
 UNION_REVOKE_INDEPENDENCE_ACCEPT_01:0 "We are sorry to hear that, [From.GetAllianceName]."
 UNION_FORM_MIGRATION_PACT_SELECT_01:1 "The [Root.GetSpeciesAdj] business acumen is high in demand. What can the [From.GetSpeciesNamePlural] offer the [Root.GetName]?"
 UNION_FORM_MIGRATION_PACT_PROPOSE_01:0 "[Root.GetSpeciesNamePlural]! We would like to invite you to our talent exchange program. We have found that free migration of people between worlds can be highly beneficial to a growing economy."
 UNION_FORM_MIGRATION_PACT_ACCEPT_01:0 "Our projections suggest a free exchange of living capital between our worlds is imperative for economic advancement. Commence the brain drain!"
 UNION_FORM_MIGRATION_PACT_REFUSE_01:0 "Our talent acquisition department is not currently recruiting externally."
 UNION_FORM_MIGRATION_PACT_REFUSE_02:0 "We will not allow for the economic dislocation of our workers."
 UNION_BREAK_MIGRATION_PACT_SELECT_01:0 "Please confirm your request to terminate the [Root.GetAdj]-[From.GetAdj] talent exchange program."
 UNION_BREAK_MIGRATION_PACT_PROPOSE_01:1 "We have found the [Root.GetSpeciesNamePlural] with their blabbering [Root.GetSpeciesMouthName] to have a disruptive effect on [From.GetAdj] corporate culture."
 UNION_BREAK_MIGRATION_PACT_ACCEPT_01:0 "The [Root.GetName] hereby confirms the discontinuation of the [Root.GetAdj]-[From.GetAdj] talent exchange program, effective immediately."
 UNION_OPEN_BORDERS_SELECT_01:0 "Open your borders and partake in the many benefits of free trade."
 UNION_OPEN_BORDERS_PROPOSE_01:0 "In the interest of promoting the liberalization of trade across the galaxy the [From.GetName] will now open its borders to you."
 UNION_OPEN_BORDERS_ACCEPT_01:0 "The [Root.GetName] thanks you for opening your borders to our trade vessels."
 UNION_CLOSE_BORDERS_SELECT_01:0 "Weigh your options carefully, [From.GetSpeciesNamePlural]. Protectionism will inhibit your nation's economic growth and welfare."
 UNION_CLOSE_BORDERS_PROPOSE_01:0 "The [From.GetName] will no longer tolerate [Root.GetAdj] intrusions into [From.GetAdj] space. All [Root.GetAdj] vessels are expected to vacate [From.GetAdj] territory immediately."
 UNION_CLOSE_BORDERS_ACCEPT_01:0 "Your protectionist policies will only serve to delay the inevitable liberalization of trade in the galaxy."
 UNION_KICK_FROM_ALLIANCE_SELECT_01:0 "Please confirm your request to exclude the [Root.GetName] from §Y[From.GetAllianceName]§!. Be advised that the [Root.GetName] will take legal action to protect its financial interests."
 UNION_KICK_FROM_ALLIANCE_PROPOSE_01:1 "The [From.GetName] regrets to inform you that the [From.GetAllianceName] board has voted unanimously to exclude the [Root.GetName] from the alliance. Please refer any complaints to our legal counsel."
 UNION_KICK_FROM_ALLIANCE_ACCEPT_01:0 "The curse of the forward thinker is that their brilliance will only be recognized in hindsight. One day the true financial genius of the [Root.GetName] will be understood."
 UNION_OFFER_FEDERATION_ASSOCIATION_STATUS_SELECT_01:0 "Please confirm your intent to offer the [Root.GetName] association status with the §Y[From.GetAllianceName]§!."
 UNION_OFFER_FEDERATION_ASSOCIATION_STATUS_PROPOSE_01:0 "After a long and fruitful cooperation, we are pleased to finally offer the [Root.GetName] association status with the [From.GetAllianceName]."
 UNION_OFFER_FEDERATION_ASSOCIATION_STATUS_ACCEPT_01:0 "The [Root.GetName] graciously accepts your offer for association status with the §Y[From.GetAllianceName]§! and looks forward to a long and prosperous cooperation."
 UNION_OFFER_FEDERATION_ASSOCIATION_STATUS_REFUSE_01:0 "The [Root.GetName] is not currently open to closer association with the §Y[From.GetAllianceName]§!."
 UNION_REVOKE_FEDERATION_ASSOCIATION_STATUS_SELECT_01:0 "Please confirm your intention to revoke [Root.GetAdj] association status with the §Y[From.GetAllianceName]§!."
 UNION_REVOKE_FEDERATION_ASSOCIATION_STATUS_PROPOSE_01:0 "The [From.GetName] regrets to inform you that the board has voted unanimously to withdraw [Root.GetAdj] association status with the §Y[From.GetAllianceName]§! due to inherent incompatibility."
 UNION_REVOKE_FEDERATION_ASSOCIATION_STATUS_ACCEPT_01:0 "Though we are saddened by your decision to revoke [Root.GetAdj] association status with the §Y[From.GetAllianceName]§!, we will continue to offer our services at affordable prices."
 UNION_ASK_FEDERATION_ASSOCIATION_STATUS_SELECT_01:0 "Please confirm your request for association status with the §Y[Root.GetAllianceName]§!."
 UNION_ASK_FEDERATION_ASSOCIATION_STATUS_PROPOSE_01:0 "Honored [Root.GetSpeciesNamePlural]! We propose strengthening our ties further by granting us association status with the §Y[Root.GetAllianceName]§!."
 UNION_ASK_FEDERATION_ASSOCIATION_STATUS_ACCEPT_01:0 "[From.GetSpeciesNamePlural]! On behalf of the §Y[Root.GetAllianceName]§! the [Root.GetName] is pleased to announce that you now have association status with the §Y[Root.GetAllianceName]§!."
 UNION_ASK_FEDERATION_ASSOCIATION_STATUS_REFUSE_01:0 "Regrettably we must inform you that your request for association status with the §Y[Root.GetAllianceName]§! has been denied."
 UNION_END_FEDERATION_ASSOCIATION_STATUS_SELECT_01:0 "Please confirm the renunciation of your association status with the §Y[Root.GetAllianceName]§!."
 UNION_END_FEDERATION_ASSOCIATION_STATUS_PROPOSE_01:0 "Hereby the [From.GetName] renounces its association status with the §Y[Root.GetAllianceName]§!. Please refer any complaints to our legal department."
 UNION_END_FEDERATION_ASSOCIATION_STATUS_ACCEPT_01:0 "Your association status with the §Y[Root.GetAllianceName]§! has been revoked."
 UNION_INSULT_FRIENDLY_01:0 "Ah, the [Root.GetSpeciesNamePlural]. Our most treasured associates! To what do we owe the pleasure today?"
 UNION_INSULT_NEUTRAL_01:0 "Please contact customer support if you are dissatisfied with our service..."
 UNION_INSULT_HOSTILE_01:0 "What was that, [Root.GetSpeciesNamePlural]? We could not hear you over the roar of the engines. We were just taking the office jet out for a spin."
 UNION_INSULT_PROPOSE_01:1 "Here at [From.GetName] we have a nose for money and you, [Root.GetSpeciesNamePlural], reek of desperation."
 UNION_INSULT_PROPOSE_02:1 "We will merchandise death and sell it to your [From.GetSpeciesSpawnNamePlural], [From.GetSpeciesNamePlural]."
 UNION_INSULT_PROPOSE_03:0 "If time is money, then judging by your annual report [From.GetSpeciesNamePlural], yours is coming to an end."
 UNION_CORP_INSULT_PROPOSE_01:0 "[Root.GetName] is yesterday's news, [From.GetName] the future. It's hardly rocket science."
 UNION_INSULT_ACCEPT_FRIENDLY_01:0 "You will never shake the [From.GetSpeciesAdj] conviction that more can be gained from trading goods than insults."
 UNION_INSULT_ACCEPT_01:1 "You have lost your edge, [Root.GetSpeciesNamePlural]. Perhaps it is time to step out of your thinking-box?"
 UNION_INSULT_ACCEPT_02:0 "Ah, the [From.GetSpeciesNamePlural]... You try so hard, yet persistently fail to move the needle. Some are just destined for mediocrity."
 UNION_INSULT_ACCEPT_03:0 "Insults and empty threats are the insolvent's weapons of choice. The [Root.GetName] protects its interests with steel and firepower."
 UNION_INSULT_ACCEPT_04:0 "If conflict is what you desire, [From.GetSpeciesNamePlural], you would do well to remember that war is won with weapons, not with words."
 UNION_INSULT_ACCEPT_05:0 "Ah, how lovely to hear from you! We just trademarked §Y[From.GetSpeciesNamePlural] Must Die§! for our new long-range ballistic missile."
