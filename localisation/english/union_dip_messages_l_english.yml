l_english:
 # Cynical Socialists
 CS_HOSTILE_GREETING_01:0 "A single [Root.GetSpeciesAdj] death is a tragedy. A billion [From.GetSpeciesAdj] deaths is a statistic."
 CS_HOSTILE_GREETING_02:0 "In the [Root.GetName], we don't hold council with capitalists. We execute them in the square as a warning to the others."
 CS_DOMINEERING_GREETING_01:0 "The revolution of the proletariat cannot be halted, [From.GetSpeciesNamePlural]. In time, you too will join us in the vanguard!"
 CS_NEUTRAL_GREETING_01:0 "We are the [Root.GetName], and we bring peace, prosperity, and equality to the galaxy."
 CS_NEUTRAL_GREETING_02:0 "The dictatorship of the proletariat is only one step on the path to class equality."
 CS_NEUTRAL_GREETING_03:0 "To guard against the threat of counter-revolution, we must always be vigilant. Are you allies of the working class, [From.GetSpeciesNamePlural]? Or are you enemies?"
 CS_NEUTRAL_GREETING_04:0 "In time, the [From.GetName] will fully enjoy the fruits of permanent revolution. Be patient during this transitional phase."
 CS_THREATENED_GREETING_01:0 "In the [Root.GetName], it takes more courage to retreat than to advance."
 CS_FRIENDLY_GREETING_01:0 "Comrade [Root.GetRulerName], welcome! Be seated, let us discuss current affairs."
 CS_FRIENDLY_GREETING_02:0 "Some indiscretions of the leadership of a great revolution are forgiveable. What's a little secret between friends, after all?"
 CS_FRIENDLY_GREETING_03:0 "The masses are confused, and unwilling to accept what must change. They need a vanguard to show them the path. We carry the banner of tomorrow!"
 CS_FRIENDLY_GREETING_04:0 "With this meeting, the [Root.GetAllianceName] strikes another blow against the capitalist scum of the galaxy!"
 CS_WAR_GREETING_01:0 "History has shown there are no invincible armies."
 CS_WAR_GREETING_02:0 "Politics is war without blood. War is politics with blood."
 CS_WAR_GREETING_03:0 "We are the revolutionary vanguard, destined to overthrow capitalism and abolish class hierarchy. You are the sacrifice we make on the altar of progress!"
 CS_WAR_GREETING_04:0 "War can only be abolished through war! To destroy the mass-driver, we must take up the mass-driver!"
 CS_VASSAL_GREETING_01:0 "The revolution advances, Comrade [From.GetRulerName]! Where is our next victory?"
 CS_VASSAL_GREETING_DISLOYAL_01:0 "... death to the bourgeoisie."

 # Humble Co-Operative
 HCOOP_HOSTILE_GREETING_01:0 "What a terrible shame that you seek enmity when we seek unity. A terrible shame indeed."
 HCOOP_HOSTILE_GREETING_02:0 "A means can only be justified by its end, [From.GetSpeciesNamePlural]. The end, in its turn, must also be justified."
 HCOOP_HOSTILE_GREETING_03:0 "Competition is the law of the jungle, but cooperation is the law of civilization. You would do well to reflect on that, [From.GetSpeciesNamePlural]."
 HCOOP_DOMINEERING_GREETING_01:0 "The [Root.GetAdj] people are more than willing to teach you the ways of prosperity, if you would only be a proper student."
 HCOOP_NEUTRAL_GREETING_01:0 "We are utopians, to such degree that we believe the revolution should provide the basic needs of all - an idea extremely displeasing to the middle class."
 HCOOP_NEUTRAL_GREETING_02:0 "[Root.GetAdj] culture places high value on collaboration and commitment to mutual benefit. We would be just as pleased to offer this to you."
 HCOOP_NEUTRAL_GREETING_03:0 "Capital goes wherever there are xenos poor enough to be exploited. We have no interest in being exploited."
 HCOOP_THREATENED_GREETING_01:0 "The people of the [Root.GetName] are interested not in conflict, but camaraderie. Let us both lay aside ill will and be siblings."
 HCOOP_FRIENDLY_GREETING_01:0 "Life is beautiful. Let the future generations cleanse it of all evil, and relish it fully."
 HCOOP_FRIENDLY_GREETING_02:0 "Well-being for all is not a dream."
 HCOOP_FRIENDLY_GREETING_03:0 "The [Root.GetName] sees its comrades and companions in the [From.GetName]. May we live long and prosper."
 HCOOP_WAR_GREETING_01:0 "As long as the labor - and the lives - of [From.GetSpeciesAdj] workers remain articles of sale, of exploitation, the 'sacredness of [From.GetSpeciesAdj] life' remains a shameful lie."
 HCOOP_WAR_GREETING_02:0 "The [Root.GetAdj] armed forces are joyful defenders of our way of life, and they shall fight to the last!"
 HCOOP_WAR_GREETING_03:0 "Money cannot buy honor in the eyes of history. Only the blood of martyrs will satisfy the price."
 HCOOP_VASSAL_GREETING_01:0 "Service to our fellow xenos always has been and always shall be the pride and joy of the [Root.GetName]."
 HCOOP_VASSAL_GREETING_DISLOYAL_01:0 "The art of peace only flourishes through understanding the science of war. And we have many, many scientists."