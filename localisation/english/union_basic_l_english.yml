# MegaUnion Personalities
 personality_cynical_socialists:0 "Cynical Socialists"
 personality_cynical_socialists_desc:0 "Cynical Socialists are of the opinion that the proletariat at large is unmotivated and defeatist in its attitudes. For permanent revolution to be attainable, sacrifices must be made. If they are unwilling, then they are traitors to the cause."
 personality_humble_cooperative:0 "Humble Co-Operative"
 personality_humble_cooperative_desc:0 "Humble Co-Operatives are chiefly concerned with the economic welfare of their citizens. Their economic model typically centers around equitable distribution initiatives managed by grassroots labour councils."

 gov_megaunion:0 "MegaUnion"
 gov_megaunion_desc:0 "A MegaUnion is a labor oligarchy, where representatives of various workers' unions have in turn formed their own over-arching union. This collossal economic juggernaut is overseen by a committee of elected stewards."
 gov_agricultural_cooperative:0 "Agricultural Co-Operative"
 gov_agricultural_cooperative_desc:0 "This MegaUnion consolidated power through controlling the agricultural industry, and to this day places high value on farming and food production."
 gov_mineral_compact:0 "Mineral Compact"
 gov_mineral_compact_desc:0 "A MegaUnion that was forged by co-operatives of miners and metalworkers. Through controlling the construction and extraction industry, they dictate the direction of this empire."
 gov_fisher_guild:0 "Fishers' Guild"
 gov_fisher_guild_desc:0 "A Fishers' Guild mandates membership in a union of fishers in order to partake of the bounty of the seas. By maintaining a strong foothold in aquaculture, this MegaUnion in turn controls the entire navy and shipping industry."

